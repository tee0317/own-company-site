<!doctype html><html lang="ja"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><style>body{font:18px/1.8 system-ui,sans-serif;color:#203a30;background:#fff;margin:0;padding:24px}*{box-sizing:border-box}label{display:block;margin:20px 0 6px}input,select,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid #718478;border-radius:8px}textarea{min-height:210px}button{min-height:52px;background:#224b3b;color:#fff;cursor:pointer;margin-top:24px}button:disabled{opacity:.6}input[type=checkbox]{width:24px;height:24px;vertical-align:middle}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}[hidden]{display:none!important}a{color:#224b3b}:focus-visible{outline:3px solid #b67b40;outline-offset:3px}.error{color:#923522}</style></head><body>
<form id="form"><label for="kind">種別（必須）</label><select id="kind" name="kind"><option value="tea">紅茶の質問</option><option value="organization">お店・団体からのご相談</option><option value="other">その他</option></select>
<label for="name">お名前（必須）</label><input id="name" name="name" autocomplete="name" maxlength="100" required>
<label for="email">返信先メールアドレス（必須）</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
<div id="organization" hidden><label for="region">地域（任意）</label><input id="region" name="region" maxlength="100"><label for="period">時期（任意）</label><input id="period" name="period" maxlength="100"><label for="people">人数（任意）</label><input id="people" name="people" maxlength="100"></div>
<label for="message">内容（必須・3,000字以内）</label><textarea id="message" name="message" maxlength="3000" required></textarea>
<div class="trap" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<label><input name="consent" type="checkbox" required> <a href="https://tsdsystem.tokyo/privacy/" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>に同意します（必須）</label>
<p id="status" role="status" aria-live="polite">受付を準備しています。</p><button id="submit" disabled>内容を送信する</button></form>
<section id="complete" hidden tabindex="-1"><h1>お問い合わせを受け付けました。</h1><p>内容を確認して返信します。</p><p>自動返信メールはお送りしていません。</p></section>
<script>
const form=document.getElementById('form'),kind=document.getElementById('kind'),button=document.getElementById('submit'),status=document.getElementById('status');let ticket=null,busy=false,uncertain=false;
kind.value='<?= kind ?>';const toggle=()=>{document.getElementById('organization').hidden=kind.value!=='organization';};kind.addEventListener('change',toggle);toggle();
google.script.run.withSuccessHandler(value=>{ticket=value;status.textContent='入力内容をご確認のうえ、送信してください。';button.disabled=false;}).withFailureHandler(()=>{status.textContent='受付を準備できませんでした。ページを開き直してください。';}).issueTicket();
form.addEventListener('submit',event=>{event.preventDefault();if(busy||uncertain||!ticket||!form.reportValidity())return;busy=true;button.disabled=true;status.textContent='送信しています。';const values=Object.fromEntries(new FormData(form));values.consent=form.elements.consent.checked;values.ticket=ticket;
const timer=setTimeout(()=>{uncertain=true;status.textContent='送信結果を確認できません。入力内容は残しています。重ねて送らず、時間をおいてご確認ください。';},30000);
google.script.run.withSuccessHandler(result=>{clearTimeout(timer);busy=false;if(result?.ok===true){form.hidden=true;const complete=document.getElementById('complete');complete.hidden=false;complete.focus();}else{status.textContent=result?.message||'送信を確認できませんでした。';status.className='error';button.disabled=uncertain;}}).withFailureHandler(()=>{clearTimeout(timer);busy=false;uncertain=true;status.textContent='送信結果を確認できません。入力内容は残しています。重ねて送らず、時間をおいてご確認ください。';}).submitContact(values);});
</script></body></html>
